<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown 查看器</title>
<link rel="stylesheet" href="github.min.css" />
<link rel="stylesheet" href="github-dark.min.css" media="(prefers-color-scheme: dark)" />
<style>
  :root{ --bg:#fff; --fg:#1f2328; --muted:#656d76; --border:#e1e4e8; --tb-bg:#f6f8fa; --code-bg:#f6f8fa; --accent:#0969da; --hover:#eceff2; --active-bg:#ddf4ff; --active-fg:#0969da; --mark:#fff8c5; --mark-cur:#ffd33d; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --border:#30363d; --tb-bg:#161b22; --code-bg:#161b22; --accent:#4493f8; --hover:#21262d; --active-bg:#0d2f4f; --active-fg:#79c0ff; --mark:#5a4a12; --mark-cur:#b8860b; } }
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  body{ background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.75; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  .tb{ flex:none; height:44px; display:flex; align-items:center; padding:0 0 0 10px; background:var(--tb-bg); border-bottom:1px solid var(--border); position:relative; user-select:none; -webkit-user-select:none;}
  .tb .grp{display:flex; align-items:center; gap:2px;} .tb .tb-right{margin-left:auto;}
  .ico{ width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:none; background:transparent; color:var(--muted); border-radius:7px; cursor:pointer; transition:background .12s,color .12s;}
  .ico:hover{ background:var(--hover); color:var(--fg);} .ico.active{ background:var(--active-bg); color:var(--active-fg);}
  .ico svg{ width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .tb-title{ position:absolute; left:50%; transform:translateX(-50%); max-width:40%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; color:var(--fg); display:flex; align-items:center; gap:6px;}
  .tb-title .sep{color:var(--border);} .tb-title .kind{color:var(--muted);}
  .wctl{display:flex; align-items:center; height:100%; margin-left:6px;}
  .wbtn{ width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border:none; background:transparent; color:var(--muted); cursor:pointer;}
  .wbtn:hover{ background:var(--hover); color:var(--fg);} .wbtn.close:hover{ background:#e81123; color:#fff;}
  .wbtn svg{ width:15px; height:15px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .searchbar{ flex:none; display:flex; align-items:center; gap:8px; padding:7px 14px; background:var(--tb-bg); border-bottom:1px solid var(--border); font-size:13px;}
  .searchbar input{ flex:none; width:260px; font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--fg); outline:none;}
  .searchbar input:focus{ border-color:var(--accent);} .searchbar .hit{color:var(--muted); min-width:64px;} .searchbar button{ width:28px; height:28px; font-size:14px;}
  .stage{ flex:1; min-height:0; position:relative; overflow:hidden;}
  textarea.src{ position:absolute; inset:0; width:100%; height:100%; border:none; outline:none; resize:none; padding:26px 34px; background:var(--bg); color:var(--fg); font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:13.5px; line-height:1.7; tab-size:4;}
  .prevwrap{ position:absolute; inset:0; display:flex; overflow:hidden;}
  nav.toc{ width:250px; flex:none; border-right:1px solid var(--border); background:var(--tb-bg); padding:20px 14px; overflow:auto; font-size:13px; transition:width .2s ease, padding .2s ease, opacity .2s ease;}
  nav.toc.collapsed{ width:0; padding:0; overflow:hidden; opacity:0; border-right:none; pointer-events:none;}
  nav.toc .toc-title{color:var(--muted); font-weight:600; margin:0 0 10px 6px; font-size:12px; letter-spacing:.5px;}
  nav.toc a{display:block; color:var(--muted); text-decoration:none; padding:4px 6px; border-radius:6px; line-height:1.5;}
  nav.toc a:hover{background:var(--hover); color:var(--fg);} nav.toc a.l2{padding-left:18px;} nav.toc a.l3{padding-left:30px;} nav.toc a.l4{padding-left:42px;}
  main{flex:1; min-width:0; overflow:auto; padding:36px 24px 120px;} article{max-width:820px; margin:0 auto;}
  @media (max-width:960px){ nav.toc{display:none!important;} }
  .drop-hint{position:absolute; inset:0; margin:auto; width:min(640px,80%); height:200px; text-align:center; color:var(--muted); border:2px dashed var(--border); border-radius:16px; padding:48px 24px; font-size:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
  body.dragover .drop-hint{border-color:var(--accent); color:var(--accent);}
  article h1,article h2,article h3,article h4{line-height:1.3;margin:1.6em 0 .6em;font-weight:700;}
  article h1{font-size:1.95em;padding-bottom:.3em;border-bottom:1px solid var(--border);}
  article h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border);}
  article h3{font-size:1.22em;} article h4{font-size:1.05em;}
  article p{margin:.8em 0;} article a{color:var(--accent);text-decoration:none;} article a:hover{text-decoration:underline;}
  article ul,article ol{padding-left:1.6em;margin:.6em 0;} article li{margin:.25em 0;}
  article blockquote{margin:1em 0;padding:.4em 1em;color:var(--muted);border-left:4px solid var(--border);background:color-mix(in srgb,var(--code-bg) 55%,transparent);border-radius:0 8px 8px 0;}
  article code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:.88em;background:var(--code-bg);padding:.16em .42em;border-radius:6px;}
  article pre{background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow:auto;border:1px solid var(--border);line-height:1.55;}
  article pre code{background:transparent;padding:0;font-size:.86em;}
  article table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:.94em;display:block;overflow:auto;}
  article th,article td{border:1px solid var(--border);padding:8px 13px;} article th{background:var(--code-bg);font-weight:700;}
  article tr:nth-child(2n) td{background:color-mix(in srgb,var(--code-bg) 40%,transparent);}
  article img{max-width:100%;border-radius:8px;} article hr{border:none;border-top:1px solid var(--border);margin:2em 0;}
  article input[type=checkbox]{margin-right:6px;}
  mark.q{background:var(--mark); color:inherit; border-radius:3px; padding:0 1px;} mark.q.cur{background:var(--mark-cur); outline:2px solid var(--mark-cur);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; z-index:50;}
  .toast.show{opacity:.92; transform:translateX(-50%) translateY(0);}
  .grip{position:fixed; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; z-index:60;}
  .grip:after{content:""; position:absolute; right:3px; bottom:3px; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); opacity:.5;}
</style>
</head>
<body>
  <div class="tb" id="tb">
    <div class="grp tb-left">
      <button class="ico" id="btn-src" title="源码 (Ctrl+/)"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
      <button class="ico active" id="btn-prev" title="预览"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="tb-title"><span id="fname">未打开文件</span><span class="sep">·</span><span class="kind">Markdown</span></div>
    <div class="grp tb-right">
      <button class="ico" id="btn-save" title="保存 (Ctrl+S) / 另存为 (Ctrl+Shift+S)"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
      <button class="ico" id="btn-search" title="搜索 (Ctrl+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button class="ico" id="btn-refresh" title="刷新预览"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      <button class="ico" id="btn-toc" title="目录 (Ctrl+T)"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg></button>
      <button class="ico" id="btn-open" title="打开文件 (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
    </div>
    <div class="wctl">
      <button class="wbtn" id="w-min" title="最小化"><svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/></svg></button>
      <button class="wbtn" id="w-max" title="最大化"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      <button class="wbtn close" id="w-close" title="关闭"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
  </div>

  <div class="searchbar" id="searchbar" style="display:none">
    <input id="q" placeholder="在预览中搜索…" />
    <span class="hit" id="hitinfo"></span>
    <button class="ico" id="qprev" title="上一个">↑</button>
    <button class="ico" id="qnext" title="下一个">↓</button>
    <button class="ico" id="qclose" title="关闭">✕</button>
  </div>

  <div class="stage">
    <textarea class="src" id="src" style="display:none" spellcheck="false" placeholder="# 在这里输入 Markdown…"></textarea>
    <div class="prevwrap" id="prevwrap">
      <nav class="toc collapsed" id="toc"></nav>
      <main><article class="markdown-body" id="content"></article></main>
    </div>
    <div class="drop-hint" id="hint">把 <b>.md</b> 文件拖进窗口，或点右上角 📁 打开</div>
  </div>

  <div class="grip" id="grip"></div>
  <div class="toast" id="toast"></div>

<script src="markdown-it.min.js"></script>
<script src="highlight.min.js"></script>
<script>
(function(){
  var md = window.markdownit({ html:true, linkify:true, typographer:true, breaks:false,
    highlight:function(str,lang){ if(lang&&hljs.getLanguage(lang)){ try{return hljs.highlight(str,{language:lang,ignoreIllegals:true}).value;}catch(e){} } return str.replace(/&/g,'&amp;').replace(/>/g,'&gt;').replace(/</g,'&lt;'); }});
  var $=function(id){return document.getElementById(id);};
  var content=$('content'), hint=$('hint'), toc=$('toc'), src=$('src'), prevwrap=$('prevwrap');
  var btnSrc=$('btn-src'), btnPrev=$('btn-prev'), btnToc=$('btn-toc');
  var currentSource='', mode='preview', tocVisible=false;

  // 目录默认收起
  toc.classList.add('collapsed');
  btnToc.classList.remove('active');

  function toggleToc(){
    tocVisible=!tocVisible;
    toc.classList.toggle('collapsed',!tocVisible);
    btnToc.classList.toggle('active',tocVisible);
  }

  function post(o){ try{ window.chrome.webview.postMessage(o); }catch(e){} }

  function slug(s){return encodeURIComponent(String(s).trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w一-龥\-]/g,''));}
  function flash(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1400); }
  function render(){
    hint.style.display = currentSource? 'none':'flex';
    content.innerHTML = md.render(currentSource);
    var heads=content.querySelectorAll('h1,h2,h3,h4'), t='<div class="toc-title">目录</div>';
    heads.forEach(function(h){ if(!h.id)h.id=slug(h.textContent); t+='<a class="l'+parseInt(h.tagName[1],10)+'" href="#'+h.id+'">'+h.textContent+'</a>'; });
    if(heads.length){
      toc.innerHTML=t;
      btnToc.style.display='';
      // 如果之前是可见的，保持可见；否则保持收起
    } else {
      toc.innerHTML='';
      btnToc.style.display='none';
      tocVisible=false;
      toc.classList.add('collapsed');
      btnToc.classList.remove('active');
    }
    content.querySelectorAll('input[type=checkbox]').forEach(function(c){c.disabled=true;});
    content.querySelectorAll('a[href^="http"]').forEach(function(a){a.target='_blank';a.rel='noopener';});
    if(searchOn && lastSearchTerm){ doSearch(lastSearchTerm); }
  }
  function setMode(m){
    mode=m;
    if(m==='src'){ src.value=currentSource; src.style.display='block'; prevwrap.style.display='none'; btnSrc.classList.add('active'); btnPrev.classList.remove('active'); src.focus(); }
    else { currentSource=src.value; src.style.display='none'; prevwrap.style.display='flex'; btnPrev.classList.add('active'); btnSrc.classList.remove('active'); render(); }
    if(searchOn && lastSearchTerm) doSearch(lastSearchTerm);   // 切模式后保留已搜索的结果
  }
  function loadText(t,name){ currentSource=t; src.value=t; $('fname').textContent=name||'document.md'; document.title=(name||'Markdown')+' — Markdown 查看器'; if(mode==='preview') render(); }

  btnSrc.addEventListener('click',function(){ setMode('src'); });
  btnPrev.addEventListener('click',function(){ setMode('preview'); });
  btnToc.addEventListener('click',function(){ toggleToc(); });
  src.addEventListener('input',function(){ currentSource=src.value; });

  $('btn-open').addEventListener('click',function(){ post({cmd:'open'}); });
  $('btn-refresh').addEventListener('click',function(){ currentSource=src.value; setMode('preview'); flash('已刷新预览'); });
  $('btn-save').addEventListener('click',function(){ post({cmd:'save', name:($('fname').textContent||'document.md'), text:(mode==='src'?src.value:currentSource)}); });

  var searchOn=false, hits=[], cur=0, srcHits=[], lastSearchTerm='';   // srcHits: [start] 位置列表（源码模式）
  function openSearch(){ searchOn=true; $('searchbar').style.display='flex'; $('q').focus(); }
  function closeSearch(){ searchOn=false; $('searchbar').style.display='none'; clearMarks(); hits=[]; srcHits=[]; cur=0; lastSearchTerm=''; $('hitinfo').textContent=''; }
  $('btn-search').addEventListener('click',function(){ searchOn? closeSearch(): openSearch(); });
  $('qclose').addEventListener('click',closeSearch);

  function clearMarks(){
    // 预览模式：清 article 里的高亮
    content.querySelectorAll('mark.q').forEach(function(m){ m.replaceWith(document.createTextNode(m.textContent)); });
    content.normalize();
    // 源码模式：清除 textarea 选区
    src.selectionStart = src.selectionEnd = src.value.length;
  }

  function doSearch(term){
    if(mode==='src'){ doSearchSrc(term); return; }
    // ---- 预览模式：DOM 高亮 ----
    clearMarks(); hits=[]; cur=0; if(!term){ $('hitinfo').textContent=''; return; }
    var esc=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); var re=new RegExp(esc,'gi');
    var walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,null,false), nodes=[], n;
    while(n=walker.nextNode()){ re.lastIndex=0; if(n.nodeValue && re.test(n.nodeValue)) nodes.push(n); }
    nodes.forEach(function(node){ var frag=document.createDocumentFragment(), t=node.nodeValue, last=0, m; re.lastIndex=0;
      while(m=re.exec(t)){ if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index))); var mk=document.createElement('mark'); mk.className='q'; mk.textContent=m[0]; frag.appendChild(mk); last=m.index+m[0].length; }
      if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last))); node.parentNode.replaceChild(frag,node); });
    hits=[].slice.call(content.querySelectorAll('mark.q'));
    $('hitinfo').textContent = hits.length? ('0/'+hits.length):'无结果';
    if(hits.length) gotoHit(0);
  }

  function doSearchSrc(term){
    clearMarks(); srcHits=[]; cur=0; if(!term){ $('hitinfo').textContent=''; return; }
    var text=src.value, lower=text.toLowerCase(), q=term.toLowerCase(), idx=0;
    while((idx=lower.indexOf(q,idx))!==-1){ srcHits.push(idx); idx+=Math.max(q.length,1); }
    $('hitinfo').textContent = srcHits.length? ('0/'+srcHits.length):'无结果';
    if(srcHits.length) gotoHit(0);
  }

  function gotoHit(i){
    if(mode==='src'){ gotoHitSrc(i); return; }
    if(!hits.length)return; if(hits[cur])hits[cur].classList.remove('cur'); cur=(i+hits.length)%hits.length; hits[cur].classList.add('cur'); $('hitinfo').textContent=(cur+1)+'/'+hits.length;
    // 明确跟随当前选中项滚动：把 main 滚到让当前高亮项居中
    var main=document.querySelector('main'); if(!main) return;
    var r=hits[cur].getBoundingClientRect(), m=main.getBoundingClientRect();
    var delta = (r.top - m.top) - main.clientHeight/2 + r.height/2;
    main.scrollTop += delta;
  }

  function gotoHitSrc(i){
    if(!srcHits.length)return;
    cur=(i+srcHits.length)%srcHits.length;
    var start=srcHits[cur], len=$('q').value.length;
    src.focus();
    src.setSelectionRange(start, start+len);
    $('hitinfo').textContent=(cur+1)+'/'+srcHits.length;
    // 让 textarea 滚动跟随到匹配行（居中）
    try {
      var line = src.value.slice(0, start).split('\n').length - 1;
      var style = getComputedStyle(src);
      var lh = parseFloat(style.lineHeight) || 20;
      var pt = parseFloat(style.paddingTop) || 0;
      src.scrollTop = Math.max(0, line * lh - src.clientHeight / 2 + pt);
    } catch(e) {}
  }

  // 回车才开始搜索：若输入词变化则执行新搜索，否则跳到下一个
  function runSearch(){
    var term=$('q').value;
    if(term!==lastSearchTerm){ lastSearchTerm=term; doSearch(term); }
    else gotoHit(cur+1);
  }
  $('q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); runSearch(); } if(e.key==='Escape') closeSearch(); });
  $('qnext').addEventListener('click',function(){ if(!hits.length&&!srcHits.length) runSearch(); else gotoHit(cur+1); });
  $('qprev').addEventListener('click',function(){ if(!hits.length&&!srcHits.length) runSearch(); else gotoHit(cur-1); });

  ['dragenter','dragover'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();document.body.classList.add('dragover');});});
  ['dragleave','drop'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();if(ev==='dragleave'&&e.relatedTarget)return;document.body.classList.remove('dragover');});});
  window.addEventListener('drop',function(e){ var f=e.dataTransfer&&e.dataTransfer.files; if(f&&f[0]) readFile(f[0]); });
  function readFile(file){ var r=new FileReader(); r.onload=function(e){ loadText(e.target.result, file.name); if(mode!=='preview') setMode('preview'); else render(); }; r.readAsText(file,'utf-8'); }

  // 无边框窗口：拖动/缩放交给系统原生；min/max/close/open/save 走 host
  $('tb').addEventListener('mousedown',function(e){ if(e.button!==0) return; if(e.target.closest('button')||e.target.closest('.searchbar')) return; post({cmd:'drag'}); });
  $('tb').addEventListener('dblclick',function(e){ if(e.target.closest('button')) return; post({cmd:'max'}); });
  $('w-min').addEventListener('click',function(){ post({cmd:'min'}); });
  $('w-max').addEventListener('click',function(){ post({cmd:'max'}); });
  $('w-close').addEventListener('click',function(){ post({cmd:'close'}); });
  $('grip').addEventListener('mousedown',function(e){ if(e.button!==0)return; e.preventDefault(); post({cmd:'resize'}); });

  window.addEventListener('keydown',function(e){ if(!(e.ctrlKey||e.metaKey))return; var k=e.key.toLowerCase();
    if(k==='s'){ e.preventDefault(); if(e.shiftKey){ post({cmd:'saveas', name:($('fname').textContent||'document.md'), text:(mode==='src'?src.value:currentSource)}); } else { $('btn-save').click(); } }
    else if(k==='o'){ e.preventDefault(); $('btn-open').click(); }
    else if(k==='f'){ e.preventDefault(); openSearch(); }
    else if(k==='r'){ e.preventDefault(); $('btn-refresh').click(); }
    else if(k==='t'){ e.preventDefault(); toggleToc(); }
    else if(k==='/'){ e.preventDefault(); setMode(mode==='src'?'preview':'src'); }
  });

  window.MDV={ onFile:function(name,text){ loadText(text,name); if(mode!=='preview') setMode('preview'); },
               onSaved:function(name){ if(name) $('fname').textContent=name; flash('已保存：'+name); } };
})();
</script>
</body>
</html>
